[workspace]
members = ["crates/pencil-array", "crates/pencil-fft", "crates/pencil-io", "crates/pencil-fftw"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/nogaki/pencil-rs"

[workspace.dependencies]
mpi = "=0.8.2"
thiserror = "2"
proptest = "1"
