[package]
name = "pencil-fft"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = []
distributed = ["dep:mpi", "dep:pencil-array", "mpi/complex"]

[dependencies]
bytemuck = { version = "1.25.2", features = ["extern_crate_alloc"] }
num-complex = { version = "0.4.6", features = ["bytemuck"] }
realfft = "~3.5.0"
rustfft = "~6.4.1"
thiserror.workspace = true
mpi = { workspace = true, optional = true }
pencil-array = { path = "../pencil-array", optional = true }

[[test]]
name = "distributed_c2c"
path = "tests/distributed_c2c.rs"
required-features = ["distributed"]

[[test]]
name = "fftw_reference"
path = "tests/fftw_reference.rs"
required-features = ["distributed"]
