name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  local-fft:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run local FFT tests without optional features
        run: cargo test -p pencil-fft --no-default-features --locked

      - name: Check local FFT dependency boundary
        run: |
          set -euo pipefail
          cargo tree -p pencil-fft --no-default-features --edges normal --locked | tee /tmp/pencil-fft-local-tree.txt
          if grep -Eq '(^|[[:space:]])(mpi|pencil-array)([[:space:]]|$)' /tmp/pencil-fft-local-tree.txt; then
            echo "local pencil-fft unexpectedly depends on MPI or pencil-array" >&2
            exit 1
          fi

  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install MPI toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --yes libopenmpi-dev openmpi-bin libhdf5-openmpi-dev pkg-config libclang-dev

      - name: Install Rust components
        run: rustup component add rustfmt clippy

      - name: Verify parallel HDF5 pkg-config discovery
        run: |
          pkg-config --exists hdf5-openmpi
          pkg-config --exists hdf5
          pkg-config --modversion hdf5-openmpi

      - name: Restore Cargo build data
        id: cargo-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}

      - name: Verify workspace metadata
        run: cargo metadata --no-deps --format-version 1

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run library tests
        run: cargo test --workspace --lib --locked

      - name: Check optional pencil-io targets
        run: cargo check -p pencil-io --all-features --all-targets --locked

      - name: Build pencil-io integration tests
        run: |
          cargo test -p pencil-io --no-default-features --test mpi_io --no-run --locked
          cargo test -p pencil-io --features parallel-hdf5 --test hdf5_io --no-run --locked

      - name: Check distributed FFT targets
        run: cargo check -p pencil-fft --features distributed --all-targets --locked

      - name: Run distributed FFT library tests
        run: cargo test -p pencil-fft --features distributed --lib --locked

      - name: Run one-rank topology tests
        run: mpiexec --oversubscribe -n 1 cargo test -p pencil-array --test topology --locked -- --nocapture --test-threads=1

      - name: Run four-rank topology tests
        run: mpiexec --oversubscribe -n 4 cargo test -p pencil-array --test topology --locked -- --nocapture --test-threads=1

      - name: Run four-rank pencil tests
        run: mpiexec --oversubscribe -n 4 cargo test -p pencil-array --test pencil --locked -- --nocapture --test-threads=1

      - name: Run one-rank pencil tests
        run: mpiexec --oversubscribe -n 1 cargo test -p pencil-array --test pencil --locked -- --nocapture --test-threads=1

      - name: Run one-rank array tests
        run: mpiexec --oversubscribe -n 1 cargo test -p pencil-array --test array --locked -- --nocapture --test-threads=1

      - name: Run four-rank array tests
        run: mpiexec --oversubscribe -n 4 cargo test -p pencil-array --test array --locked -- --nocapture --test-threads=1

      - name: Run one-rank array access tests
        run: mpiexec --oversubscribe -n 1 cargo test -p pencil-array --test array_access --locked -- --nocapture --test-threads=1

      - name: Run four-rank array access tests
        run: mpiexec --oversubscribe -n 4 cargo test -p pencil-array --test array_access --locked -- --nocapture --test-threads=1

      - name: Run six-rank array access tests
        run: mpiexec --oversubscribe -n 6 cargo test -p pencil-array --test array_access --locked -- --nocapture --test-threads=1

      - name: Run one-rank collectives tests
        run: mpiexec --oversubscribe -n 1 cargo test -p pencil-array --test collectives --locked -- --nocapture --test-threads=1

      - name: Run four-rank collectives tests
        run: mpiexec --oversubscribe -n 4 cargo test -p pencil-array --test collectives --locked -- --nocapture --test-threads=1

      - name: Run six-rank collectives tests
        run: mpiexec --oversubscribe -n 6 cargo test -p pencil-array --test collectives --locked -- --nocapture --test-threads=1

      - name: Run one-rank shared array tests
        run: mpiexec --oversubscribe -n 1 cargo test -p pencil-array --test many --locked -- --nocapture --test-threads=1

      - name: Run four-rank shared array tests
        run: mpiexec --oversubscribe -n 4 cargo test -p pencil-array --test many --locked -- --nocapture --test-threads=1

      - name: Run one-rank local transpose tests
        run: timeout --foreground 120s mpiexec --oversubscribe -n 1 cargo test -p pencil-array --test local_transpose --locked -- --nocapture --test-threads=1

      - name: Run four-rank local transpose tests
        run: timeout --foreground 120s mpiexec --oversubscribe -n 4 cargo test -p pencil-array --test local_transpose --locked -- --nocapture --test-threads=1

      - name: Run one-rank distributed transpose (Alltoallv/P2P out-of-place and in-place) tests
        run: timeout --foreground 120s mpiexec --oversubscribe -n 1 cargo test -p pencil-array --test alltoallv_transpose --locked -- --nocapture --test-threads=1

      - name: Run four-rank distributed transpose (Alltoallv/P2P out-of-place and in-place) tests
        run: timeout --foreground 120s mpiexec --oversubscribe -n 4 cargo test -p pencil-array --test alltoallv_transpose --locked -- --nocapture --test-threads=1

      - name: Run six-rank distributed transpose (Alltoallv/P2P out-of-place and in-place) tests
        run: timeout --foreground 120s mpiexec --oversubscribe -n 6 cargo test -p pencil-array --test alltoallv_transpose --locked -- --nocapture --test-threads=1

      - name: Run distributed C2C/R2C/C2R FFT suite (Alltoallv/P2P) on one rank
        run: timeout --foreground 120s mpiexec --oversubscribe -n 1 cargo test -p pencil-fft --features distributed --test distributed_c2c --locked -- --nocapture --test-threads=1

      - name: Run distributed C2C/R2C/C2R FFT suite (Alltoallv/P2P) on four ranks
        run: timeout --foreground 120s mpiexec --oversubscribe -n 4 cargo test -p pencil-fft --features distributed --test distributed_c2c --locked -- --nocapture --test-threads=1

      - name: Run distributed C2C/R2C/C2R FFT suite (Alltoallv/P2P) on six ranks
        run: timeout --foreground 120s mpiexec --oversubscribe -n 6 cargo test -p pencil-fft --features distributed --test distributed_c2c --locked -- --nocapture --test-threads=1

      - name: Run R2R, mixed, and phase-failure tests with exact filters
        run: |
          set -euo pipefail
          log=$(mktemp)
          trap 'rm -f "$log"' EXIT
          run_one() {
            if ! "$@" >"$log" 2>&1; then
              cat "$log"
              return 1
            fi
            cat "$log"
            grep -Eq 'test result: ok\. 1 passed; 0 failed; 0 ignored; 0 measured; [0-9]+ filtered out' "$log"
          }
          for n in 1 4 6; do
            run_one timeout --kill-after=5s 240s \
              mpiexec --oversubscribe -n "$n" \
              cargo test -p pencil-fft --features distributed --test distributed_r2r \
                --locked distributed_r2r_oracle_matrix_and_negative_contracts -- \
                --exact --nocapture --test-threads=1
            run_one timeout --kill-after=5s 240s \
              mpiexec --oversubscribe -n "$n" \
              cargo test -p pencil-fft --features distributed --test distributed_mixed \
                --locked mixed_tensor_oracles_and_collective_failures -- \
                --exact --nocapture --test-threads=1
            run_one timeout --kill-after=5s 240s \
              mpiexec --oversubscribe -n "$n" \
              cargo test -p pencil-fft --features distributed --lib --locked \
                distributed::tests::in_place_transaction_poison_survives_error_and_panic -- \
                --exact --nocapture --test-threads=1
          done
          # MPI is initialized once in this separate one-rank test process.
          run_one timeout --kill-after=5s 120s \
            cargo test -p pencil-fft --features distributed --lib --locked \
              distributed::r2r::tests::in_place_error_panic_backend_and_short_workspace_poison_contracts -- \
              --ignored --exact --nocapture --test-threads=1

      - name: Run pencil-io MPI-IO tests
        run: |
          for n in 1 4 6; do
            timeout --foreground 120s mpiexec --oversubscribe -n "$n" \
              cargo test -p pencil-io --no-default-features --test mpi_io --locked \
                -- --nocapture --test-threads=1
          done

      - name: Run pencil-io parallel HDF5 tests
        run: |
          for n in 1 4 6; do
            timeout --foreground 180s mpiexec --oversubscribe -n "$n" \
              cargo test -p pencil-io --features parallel-hdf5 --test hdf5_io --locked \
                -- --nocapture --test-threads=1
          done

      - name: Run pencil-io post-cleanup unit test in a fresh process
        run: |
          timeout --foreground 120s mpiexec --oversubscribe -n 1 \
            cargo test -p pencil-io --features parallel-hdf5 --lib \
              post_cleanup_errors_preserve_destination_and_valid_commits --locked \
              -- --nocapture --test-threads=1

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Run distributed FFT Clippy
        run: cargo clippy -p pencil-fft --features distributed --all-targets --locked -- -D warnings

      - name: Run pencil-io Clippy with optional HDF5
        run: cargo clippy -p pencil-io --all-features --all-targets --locked -- -D warnings

      - name: Build API documentation
        run: cargo doc --workspace --no-deps --locked

      - name: Build distributed FFT documentation
        run: cargo doc -p pencil-fft --features distributed --no-deps --locked

      - name: Build pencil-io documentation with optional HDF5
        run: cargo doc -p pencil-io --all-features --no-deps --locked

      - name: Test documentation examples and public API restrictions
        run: cargo test --workspace --doc --locked -- --show-output

      - name: Test distributed FFT documentation
        run: cargo test -p pencil-fft --features distributed --doc --locked -- --show-output

      - name: Save Cargo build data
        if: always() && steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

  msrv:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install MPI toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --yes libopenmpi-dev openmpi-bin libhdf5-openmpi-dev pkg-config libclang-dev
      - name: Verify parallel HDF5 pkg-config discovery
        run: |
          pkg-config --exists hdf5-openmpi
          pkg-config --exists hdf5
          pkg-config --modversion hdf5-openmpi
      - name: Install minimum supported Rust
        run: rustup toolchain install 1.85.0 --profile minimal
      - name: Check minimum supported Rust
        run: cargo +1.85.0 check --workspace --all-targets --locked

      - name: Check pencil-io with optional HDF5 on minimum supported Rust
        run: cargo +1.85.0 check -p pencil-io --all-features --all-targets --locked

      - name: Check distributed FFT on minimum supported Rust
        run: cargo +1.85.0 check -p pencil-fft --features distributed --all-targets --locked
