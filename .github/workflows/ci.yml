name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install MPI toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --yes libopenmpi-dev openmpi-bin pkg-config

      - name: Install Rust components
        run: rustup component add rustfmt clippy

      - name: Restore Cargo build data
        id: cargo-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.toml') }}

      - name: Verify workspace metadata
        run: cargo metadata --no-deps --format-version 1

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run library tests
        id: library-tests
        continue-on-error: true
        run: cargo test -p pencil-array --lib

      - name: Run four-rank topology tests
        id: topology-tests
        if: steps.library-tests.outcome == 'success'
        continue-on-error: true
        run: mpiexec --oversubscribe -n 4 cargo test -p pencil-array --test topology -- --nocapture --test-threads=1

      - name: Run Clippy
        id: clippy
        if: steps.library-tests.outcome == 'success' && steps.topology-tests.outcome == 'success'
        continue-on-error: true
        run: cargo clippy -p pencil-array --all-targets -- -D warnings

      - name: Save Cargo build data
        if: always() && steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

      - name: Propagate library test failure
        if: steps.library-tests.outcome == 'failure'
        run: exit 1

      - name: Propagate topology test failure
        if: steps.topology-tests.outcome == 'failure'
        run: exit 1

      - name: Propagate Clippy failure
        if: steps.clippy.outcome == 'failure'
        run: exit 1
